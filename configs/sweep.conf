broker_id=broker_sweep
listen_port=8080
parent_addr=
coords=0.0,0.0
brake_limit=4
brake_window=10
# brake_scope: brake 作用的传播方向 (upward|local|both)。both = 上行传播与本地投递都限流，
#              最接近论文 Algorithm 1 的通用限流语义。见 docs/audit_2026-08.md Q1。
brake_scope=both
# require_he: 若 true，读不到 HEPS 密钥必须 fail-fast（禁止静默退回明文）。
#             论文实验的加密场景建议设为 true；本仓库默认 false 以兼容旧脚本。
require_he=false
